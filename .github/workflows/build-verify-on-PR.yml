name: PR testing

on:
  pull_request:
    branches: 
    - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  
      - name: Validate Contribution
        uses: joelanford/opm-validate@1cc529703fd0d46b2eb2b23ea9b561a040f4ca5c # v0.1.0
        with:
          catalog: catalog
